[package]
name = "examhelper"
version = "0.1.0"
edition = "2021"
authors = ["ophiocus <csantanad@gmail.com>"]
description = "Colombian naturalization exam study helper – reading & multiple-choice practice"
license = "MIT"

[dependencies]
eframe = "0.28"
egui_commonmark = { version = "0.17", features = ["better_syntax_highlighting"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
rand = "0.8"
tts = "0.26"

[package.metadata.wix]
upgrade-guid = "A1B2C3D4-E5F6-7890-ABCD-EF1234567890"
path-guid = "B2C3D4E5-F6A7-8901-BCDE-F23456789012"
license = false
eula = false

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true
