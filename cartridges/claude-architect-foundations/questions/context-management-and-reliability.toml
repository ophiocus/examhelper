# =============================================================================
# Context Management and Reliability — Question Bank
# =============================================================================

[[questions]]
text = "What is the default context window of recent Claude models?"
options = ["8K tokens", "32K tokens", "200K tokens", "10M tokens"]
answer = 2

[[questions]]
text = "Which of these is a context-management strategy when an agent approaches the window limit?"
options = [
    "Compaction",
    "Sub-agent delegation",
    "Context pruning",
    "All of the above",
]
answer = 3

[[questions]]
text = "What is the main trade-off of compacting earlier conversation history?"
options = [
    "It costs more tokens",
    "It loses detail; specific tool results and intermediate work disappear into a summary",
    "It breaks streaming",
    "It invalidates the cache permanently",
]
answer = 1

[[questions]]
text = "Why does sub-agent delegation help with context management?"
options = [
    "The sub-agent's verbose intermediate work stays in its own context; only its final report enters the parent's",
    "The sub-agent runs on a smaller model",
    "The sub-agent uses a different API account",
    "The sub-agent's tokens are not billed",
]
answer = 0

