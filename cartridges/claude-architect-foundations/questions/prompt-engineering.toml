# =============================================================================
# Prompt Engineering — Question Bank
# =============================================================================

[[questions]]
text = "Where does the system prompt go in a Messages API request?"
options = [
    "In the first entry of the messages array with role 'system'",
    "In the `system` field, separate from the messages array",
    "Prepended to the first user message",
    "In the `tools` array",
]
answer = 1

[[questions]]
text = "Which roles are valid in the `messages` array?"
options = [
    "system, user, assistant",
    "user and assistant only",
    "user, assistant, tool",
    "input and output",
]
answer = 1

[[questions]]
text = "What is 'few-shot prompting'?"
options = [
    "Calling the model fewer than five times",
    "Including worked examples in the prompt before the actual task",
    "Using temperature near zero",
    "Using the smallest model variant available",
]
answer = 1

[[questions]]
text = "What is the canonical way to force Claude's response to start with `{`?"
options = [
    "Set temperature to 0",
    "Prefill the assistant turn with `{`",
    "Use a `format: 'json'` field",
    "Wrap the system prompt in <json> tags",
]
answer = 1

[[questions]]
text = "What `cache_control` type marks a prompt-cache breakpoint?"
options = ["persistent", "ephemeral", "static", "cached"]
answer = 1

[[questions]]
text = "Approximately how much does a prompt-cache READ cost relative to base input tokens?"
options = ["About 0.1×", "About 0.5×", "About 1×", "About 2×"]
answer = 0

[[questions]]
text = "Approximately how much does a prompt-cache WRITE cost relative to base input tokens?"
options = ["About 0.1×", "About 0.5×", "About 1.25×", "About 10×"]
answer = 2

[[questions]]
text = "What is the standard prompt-cache TTL?"
options = ["1 minute", "5 minutes", "1 hour", "24 hours"]
answer = 1

[[questions]]
text = "Extended prompt caching offers what TTL?"
options = ["15 minutes", "30 minutes", "1 hour", "24 hours"]
answer = 2

[[questions]]
text = "How many cache breakpoints can a single Messages request contain?"
options = ["1", "2", "4", "10"]
answer = 2

[[questions]]
text = "Which of the following silently disables prompt caching?"
options = [
    "Appending new messages after the cached prefix",
    "Adding a unique timestamp at the top of the system prompt",
    "Increasing max_tokens",
    "Switching the model variant within the same family",
]
answer = 1

[[questions]]
text = "Which of these is NOT a recommended prompt-engineering technique?"
options = [
    "Wrapping prompt sections in XML tags",
    "Putting the document before the question for long-context tasks",
    "Repeating the same instruction in different words three times",
    "Providing worked examples in <example> tags",
]
answer = 2

[[questions]]
text = "Why prefer 'Be terse' over 'Don't be verbose' in a prompt?"
options = [
    "Token count savings",
    "The model attends to what is described, even when negated; positive framing is more reliable",
    "Negation is forbidden in the API",
    "Negation triggers a refusal",
]
answer = 1

[[questions]]
text = "Extended thinking is most valuable for which kind of task?"
options = [
    "Simple classification",
    "Hard multi-step reasoning, complex planning, math",
    "High-throughput batch extraction",
    "Image captioning",
]
answer = 1
