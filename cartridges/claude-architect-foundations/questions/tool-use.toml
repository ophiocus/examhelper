# =============================================================================
# Tool Use — Question Bank
# =============================================================================

[[questions]]
text = "Which three fields are required when defining a tool for Claude?"
options = [
    "name, description, input_schema",
    "name, version, body",
    "id, function, args",
    "tool_id, tool_name, tool_handler",
]
answer = 0

[[questions]]
text = "What schema format describes a tool's input arguments?"
options = ["OpenAPI 3", "JSON Schema", "TypeSpec", "Protobuf"]
answer = 1

[[questions]]
text = "After Claude returns a `tool_use` block, in what role must the application reply with the tool result?"
options = ["assistant", "tool", "user", "system"]
answer = 2

[[questions]]
text = "Which field in a `tool_result` block correlates it with the original tool call?"
options = ["call_id", "tool_use_id", "id", "ref"]
answer = 1

[[questions]]
text = "Setting `tool_choice` to `{ type: 'tool', name: 'X' }` causes Claude to:"
options = [
    "Refuse to use any tool",
    "Decide whether to use tool X",
    "Be required to call tool X next",
    "Use X only if confidence is high",
]
answer = 2

[[questions]]
text = "What is the recommended technique for getting reliably-schemed JSON output from Claude?"
options = [
    "Ask politely in the system prompt",
    "Use a tool whose input schema is the desired output, forced via tool_choice",
    "Set temperature to 0 and hope for the best",
    "Parse the response as YAML and convert it",
]
answer = 1

[[questions]]
text = "If a single assistant turn contains multiple tool_use blocks, how should the application reply?"
options = [
    "Send one user message per tool_result, in separate API calls",
    "Send a single user message containing one tool_result block for each tool_use",
    "Send only the first tool_result; Claude will ask again for the others",
    "It is not allowed to have multiple tool_use blocks per turn",
]
answer = 1

[[questions]]
text = "Which `tool_choice` value prevents the model from calling any tool?"
options = [
    "{ type: 'auto' }",
    "{ type: 'any' }",
    "{ type: 'none' }",
    "{ type: 'noop' }",
]
answer = 2

[[questions]]
text = "What is the most reliable way to ensure a tool's `description` produces good selection behavior?"
options = [
    "Keep it under 10 words",
    "Describe what the tool does, when to use it, and what its arguments mean",
    "Match the function name verbatim",
    "Use marketing copy",
]
answer = 1

[[questions]]
text = "Which JSON Schema feature is the most effective at constraining a model output to a fixed set of values?"
options = ["maxLength", "pattern", "enum", "format"]
answer = 2
