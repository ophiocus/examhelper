[[templates]]
text = "What does {key} mean in English?"
variable = "word"
answer_template = "{value}"
distractors = ["dog", "cat", "mountain", "river", "sky", "flower", "bird", "tree", "rain", "snow", "moon", "star", "sun", "fish", "water"]
pairs = [
    { key = "いぬ (inu)", value = "dog" },
    { key = "ねこ (neko)", value = "cat" },
    { key = "やま (yama)", value = "mountain" },
    { key = "そら (sora)", value = "sky" },
    { key = "はな (hana)", value = "flower" },
    { key = "とり (tori)", value = "bird" },
    { key = "ゆき (yuki)", value = "snow" },
    { key = "つき (tsuki)", value = "moon" },
    { key = "ほし (hoshi)", value = "star" },
    { key = "みず (mizu)", value = "water" },
    { key = "なつ (natsu)", value = "summer" },
    { key = "ふゆ (fuyu)", value = "winter" },
    { key = "よる (yoru)", value = "night" },
    { key = "もり (mori)", value = "forest" },
    { key = "りんご (ringo)", value = "apple" },
]

