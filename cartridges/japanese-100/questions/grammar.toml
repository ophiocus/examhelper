[[templates]]
text = "What is {key} in Japanese?"
variable = "number"
answer_template = "{value}"
distractors = ["いち", "に", "さん", "よん", "ご", "ろく", "なな", "はち", "きゅう", "じゅう", "にじゅう", "さんじゅう", "ひゃく", "せん"]
pairs = [
    { key = "1", value = "いち" },
    { key = "2", value = "に" },
    { key = "3", value = "さん" },
    { key = "5", value = "ご" },
    { key = "6", value = "ろく" },
    { key = "8", value = "はち" },
    { key = "10", value = "じゅう" },
    { key = "20", value = "にじゅう" },
    { key = "100", value = "ひゃく" },
    { key = "1000", value = "せん" },
]
