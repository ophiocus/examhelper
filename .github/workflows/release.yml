name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Pin to a specific stable so local-vs-CI drift surfaces at PR time
      # via ci.yml, not at tag-push time.
      #
      # KEEP IN SYNC WITH .github/workflows/ci.yml — toolchain version,
      # components, and the fmt gate below must match.
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml version
        shell: pwsh
        run: |
          $tag   = "${{ github.ref_name }}" -replace '^v',''
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches.Groups[1].Value
          if ($tag -ne $cargo) {
            Write-Error "tag '$tag' does not match Cargo.toml version '$cargo' — bump Cargo.toml before tagging"
            exit 1
          }
          echo "Release version: $tag"

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: Build release
        run: cargo build --release

      # Cache cargo-wix binary by toolchain version so subsequent releases
      # skip the ~1-2 min compile.
      - name: Cache cargo-wix
        id: wix-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-wix.exe
          key: cargo-wix-${{ runner.os }}-rust-1.95.0

      - name: Install cargo-wix (cache miss)
        if: steps.wix-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-wix

      - name: Download WiX 3.11 portable binaries
        shell: pwsh
        run: |
          $url  = 'https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip'
          $zip  = "$env:TEMP\wix311.zip"
          $dest = "$env:TEMP\wix311"
          Invoke-WebRequest $url -OutFile $zip
          Expand-Archive $zip -DestinationPath $dest
          echo "$dest" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build MSI installer
        # cargo-wix auto-defines -dVersion from Cargo.toml's version.
        # Don't pass our own — it collides as candle.exe CNDL0288.
        run: cargo wix --nocapture

      - name: Upload MSI
        uses: actions/upload-artifact@v5
        with:
          name: examhelper-windows-msi
          path: target/wix/*.msi

      - uses: actions/upload-artifact@v5
        with:
          name: examhelper-windows
          path: target/release/examhelper.exe

  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/examhelper-windows/examhelper.exe
            artifacts/examhelper-windows-msi/*.msi
          generate_release_notes: true
