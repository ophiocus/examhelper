[[questions]]
text = "¿Cuántos mecanismos de participación democrática establece la Constitución colombiana?"
options = ["3", "5", "7", "10"]
answer = 2

[[questions]]
text = "¿Cuál de los siguientes NO es un mecanismo de participación ciudadana en Colombia?"
options = [
