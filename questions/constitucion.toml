# =============================================================================
# Constitución Política de Colombia - Banco de Preguntas
# =============================================================================

# --- Naturaleza del Estado ---

[[questions]]
text = "¿Cómo se define Colombia según el Artículo 1 de la Constitución?"
options = [
    "Un Estado Social de Derecho, organizado en forma de república unitaria, descentralizada",
    "Una república federal con autonomía de sus estados",
    "Una monarquía constitucional parlamentaria",
    "Un Estado centralizado sin autonomía territorial",
]
answer = 0

[[questions]]
text = "¿En qué año se promulgó la Constitución Política vigente de Colombia?"
options = ["1886", "1991", "1810", "2001"]
answer = 1

[[questions]]
text = "¿Cuál es la capital de la República de Colombia?"
options = ["Medellín", "Cali", "Bogotá D.C.", "Barranquilla"]
answer = 2

[[questions]]
text = "¿Cuál es el idioma oficial de Colombia según la Constitución?"
options = ["El español y el inglés", "El castellano", "El español y las lenguas indígenas", "No tiene idioma oficial"]
answer = 1

[[questions]]
text = "¿En quién reside la soberanía según la Constitución de Colombia?"
options = [
    "En el Presidente de la República",
    "En el Congreso",
    "En el pueblo, del cual emana el poder público",
    "En las Fuerzas Armadas",
]
answer = 2

# --- Ramas del Poder Público ---

[[questions]]
text = "¿Cuántas ramas del poder público establece la Constitución de Colombia?"
options = ["Dos: ejecutiva y legislativa", "Tres: legislativa, ejecutiva y judicial", "Cuatro: legislativa, ejecutiva, judicial y electoral", "Una sola rama unificada"]
answer = 1

[[questions]]
text = "¿Qué órganos conforman la rama legislativa del poder público en Colombia?"
options = [
    "La Presidencia y los Ministerios",
    "El Senado de la República y la Cámara de Representantes",
    "La Corte Suprema de Justicia y el Consejo de Estado",
    "La Procuraduría y la Contraloría",
]
answer = 1

[[questions]]
text = "¿Cuántos senadores conforman el Senado de la República de Colombia?"
options = ["100", "108", "120", "90"]
answer = 1

[[questions]]
text = "¿Aproximadamente cuántos miembros tiene la Cámara de Representantes de Colombia?"
options = ["100", "150", "188", "200"]
answer = 2

[[questions]]
text = "¿Quién es el jefe de Estado, jefe de Gobierno y suprema autoridad administrativa en Colombia?"
options = [
    "El Presidente del Congreso",
    "El Presidente de la República",
    "El Presidente de la Corte Suprema",
    "El Procurador General",
]
answer = 1

[[questions]]
text = "¿Cuántos años dura el período presidencial en Colombia?"
options = ["5 años", "6 años", "4 años", "3 años"]
answer = 2

[[questions]]
text = "¿Se permite la reelección presidencial en Colombia actualmente?"
options = [
    "Sí, por un período adicional",
    "Sí, de forma indefinida",
    "No, está prohibida absolutamente desde el Acto Legislativo 02 de 2015",
    "Solo si lo aprueba el Congreso",
]
answer = 2

# --- Órganos de Control y Organización Electoral ---

[[questions]]
text = "¿Cuáles son los organismos de control en Colombia?"
options = [
    "La Fiscalía y la Defensoría",
    "El Ministerio Público (Procuraduría) y la Contraloría General de la República",
    "El Senado y la Cámara",
    "La Corte Constitucional y el Consejo de Estado",
]
answer = 1

[[questions]]
text = "¿Cuál es la función principal de la Procuraduría General de la Nación?"
options = [
    "Administrar los recursos del Estado",
    "Vigilar la conducta de los servidores públicos y defender los derechos humanos",
    "Juzgar a los criminales",
    "Aprobar las leyes del Congreso",
]
answer = 1

[[questions]]
text = "¿Cuál es la función principal de la Contraloría General de la República?"
options = [
    "Defender los derechos de los ciudadanos",
    "Vigilar la gestión fiscal del Estado y de los particulares que manejan fondos públicos",
    "Investigar los delitos penales",
    "Nombrar a los gobernadores",
]
answer = 1

[[questions]]
text = "¿Qué función cumple la Defensoría del Pueblo en Colombia?"
options = [
    "Recaudar los impuestos nacionales",
    "Promover, ejercer y divulgar los derechos humanos",
    "Dirigir las Fuerzas Armadas",
    "Nombrar a los magistrados de las cortes",
]
answer = 1

[[questions]]
text = "¿Qué organismo está encargado de la investigación penal en Colombia?"
options = [
    "La Procuraduría General de la Nación",
    "La Contraloría General de la República",
    "La Fiscalía General de la Nación",
    "La Defensoría del Pueblo",
]
answer = 2

[[questions]]
text = "¿Qué organismos conforman la organización electoral en Colombia?"
options = [
    "La Fiscalía y la Procuraduría",
    "El Consejo Nacional Electoral y la Registraduría Nacional del Estado Civil",
    "El Senado y la Cámara de Representantes",
    "La Corte Suprema y la Corte Constitucional",
]
answer = 1

# --- Rama Judicial ---

[[questions]]
text = "¿Cuál es la máxima autoridad de la jurisdicción constitucional en Colombia?"
options = [
    "La Corte Suprema de Justicia",
    "El Consejo de Estado",
    "La Corte Constitucional",
    "El Consejo Superior de la Judicatura",
]
answer = 2

[[questions]]
text = "¿Cuál es el tribunal supremo de la jurisdicción ordinaria en Colombia?"
options = [
    "La Corte Constitucional",
    "La Corte Suprema de Justicia",
    "El Consejo de Estado",
    "La Fiscalía General",
]
answer = 1

[[questions]]
text = "¿Cuál es el tribunal supremo de la jurisdicción contencioso-administrativa?"
options = [
    "La Corte Constitucional",
    "La Corte Suprema de Justicia",
    "El Consejo de Estado",
    "El Tribunal Superior de Bogotá",
]
answer = 2

# --- Derechos Fundamentales ---

[[questions]]
text = "¿Existe la pena de muerte en Colombia?"
options = [
    "Sí, para delitos de traición a la patria",
    "Sí, para delitos graves como el terrorismo",
    "No, la Constitución prohíbe la pena de muerte",
    "Solo en tiempos de guerra",
]
answer = 2

[[questions]]
text = "¿Qué mecanismo constitucional protege los derechos fundamentales de manera inmediata en Colombia?"
options = [
    "La acción popular",
    "La acción de tutela",
    "El habeas corpus",
    "La acción de cumplimiento",
]
answer = 1

[[questions]]
text = "¿En qué artículo de la Constitución se consagra la acción de tutela?"
options = ["Artículo 40", "Artículo 86", "Artículo 96", "Artículo 100"]
answer = 1

[[questions]]
text = "¿Cuál de los siguientes es un derecho fundamental reconocido en la Constitución colombiana?"
options = [
    "El derecho a portar armas de fuego",
    "El derecho a la vida",
    "El derecho a la reelección presidencial",
    "El derecho a no pagar impuestos",
]
answer = 1

[[questions]]
text = "¿Qué derecho fundamental permite a toda persona presentar solicitudes respetuosas a las autoridades y obtener pronta resolución?"
options = [
    "Derecho a la intimidad",
    "Derecho de petición",
    "Derecho a la libre expresión",
    "Derecho al voto",
]
answer = 1

[[questions]]
text = "¿Cuál de los siguientes derechos está consagrado como fundamental en la Constitución de 1991?"
options = [
    "El derecho a una vivienda lujosa",
    "El derecho a la igualdad ante la ley",
    "El derecho a viajar sin pasaporte",
    "El derecho a no ser juzgado por ningún delito",
]
answer = 1

