# --- Nacionalidad ---

[[questions]]
text = "¿Qué artículo de la Constitución regula las normas sobre la nacionalidad colombiana?"
options = ["Artículo 86", "Artículo 96", "Artículo 100", "Artículo 40"]
answer = 1

[[questions]]
text = "¿Puede un extranjero adquirir la nacionalidad colombiana por adopción?"
options = [
    "No, la nacionalidad colombiana es solo por nacimiento",
    "Sí, cumpliendo los requisitos establecidos por la ley",
    "Solo si renuncia a su nacionalidad de origen",
    "Solo si es ciudadano de un país vecino",
]
answer = 1

[[questions]]
text = "¿Cuál de los siguientes es un mecanismo de participación ciudadana en Colombia?"
options = [
    "El cabildo abierto",
    "La dictadura popular",
    "La imposición legislativa",
    "El decreto presidencial",
]
answer = 0

[[questions]]
text = "¿Qué garantiza el Artículo 20 de la Constitución colombiana?"
options = [
    "El derecho a la propiedad privada",
    "La libertad de expresión e información",
    "El derecho a la educación gratuita",
    "La libertad de comercio internacional",
]
answer = 1

[[questions]]
text = "¿Qué establece la Constitución de Colombia sobre la educación?"
options = [
    "Es un privilegio solo para ciudadanos colombianos",
    "Es un derecho y un servicio público con función social",
    "Es obligatoria solo hasta los 10 años",
    "No se menciona en la Constitución",
]
answer = 1

