# --- Bandera ---

[[questions]]
text = "¿Cuáles son los colores de la bandera de Colombia de arriba hacia abajo?"
options = [
    "Rojo, azul y amarillo",
    "Amarillo, azul y rojo",
    "Azul, blanco y rojo",
    "Verde, amarillo y azul",
]
answer = 1

[[questions]]
text = "¿Qué representa el color amarillo en la bandera de Colombia?"
options = [
    "La sangre de los héroes",
    "Los dos mares que bañan al país",
    "La riqueza del suelo colombiano y sus recursos naturales",
    "La esperanza del pueblo",
]
answer = 2

[[questions]]
text = "¿Qué representa el color azul en la bandera de Colombia?"
options = [
    "La justicia y la libertad",
    "Los dos mares que bañan las costas colombianas",
    "La riqueza mineral del país",
    "El cielo que cubre la nación",
]
answer = 1

[[questions]]
text = "¿Qué representa el color rojo en la bandera de Colombia?"
options = [
    "La riqueza del suelo",
    "Los mares colombianos",
    "La sangre derramada por los héroes que lucharon por la independencia",
    "El fuego de los volcanes andinos",
]
answer = 2

[[questions]]
text = "¿A quién se le atribuye el diseño de los colores de la bandera de Colombia?"
options = [
    "Simón Bolívar",
    "Francisco de Miranda",
    "Antonio Nariño",
    "Francisco de Paula Santander",
]
answer = 1

